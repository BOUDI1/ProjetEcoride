<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRide - Rechercher un Covoiturage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .search-container { display: grid; grid-template-columns: 320px 1fr; gap: 30px; margin: 40px auto; }
        .filter-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: fit-content; border-top: 5px solid #2ecc71; }
        .filter-card h3 { margin-top: 0; color: #2c3e50; font-size: 1.2rem; margin-bottom: 20px; }
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #2c3e50; font-size: 0.95rem; }
        .input-group input, .input-group select { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
        
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card-trajet { background: white; border-radius: 15px; padding: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #2ecc71; position: relative; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
        .card-trajet:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .badge-eco { position: absolute; top: 12px; right: 12px; background: #eafaf1; color: #27ae60; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .price { font-size: 1.5rem; font-weight: bold; color: #27ae60; margin: 10px 0; }
        .btn-view-detail { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; margin-top: 15px; display: block; text-align: center; text-decoration: none; }
        .btn-view-detail:hover { background: #27ae60; }
        
        .chauffeur-info { display: flex; align-items: center; gap: 12px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 12px; }
        .photo-mini { width: 45px; height: 45px; border-radius: 50%; background: #ddd; object-fit: cover; border: 2px solid #eafaf1; }
        .stars { color: #f1c40f; font-size: 0.9rem; }
        
        .alert-proposal { background: #fdf2e9; border-left: 5px solid #e67e22; padding: 20px; border-radius: 8px; margin-bottom: 25px; text-align: left; }
        .btn-proposal { background: #e67e22; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-proposal:hover { background: #d35400; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="index.html">EcoRide 🌿</a></h1>
            <nav class="nav">
                <ul class="nav-list" id="nav-list">
                    <li><a href="index.html"><i class="fas fa-home"></i> Accueil</a></li>
                    <li class="active"><a href="covoiturages.html"><i class="fas fa-car"></i> Covoiturages</a></li>
                    <li id="menu-proposer" class="hidden"><a href="proposer-trajet.html"><i class="fas fa-plus-circle"></i> Proposer un trajet</a></li>
                    <li id="menu-admin" class="hidden"><a href="admin.html"><i class="fas fa-user-shield"></i> Administration</a></li>
                    <li id="menu-employe" class="hidden"><a href="employe.html"><i class="fas fa-user-check"></i> Espace Employé</a></li>
                    <li id="menu-connexion"><a href="connexion.html"><i class="fas fa-sign-in-alt"></i> Connexion</a></li>
                    <li id="menu-deconnexion" class="hidden"><a href="#" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
                    <li><a href="contact.html"><i class="fas fa-headset"></i> Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container search-container">
        <!-- Sidebar Filtres & Recherche -->
        <aside class="filter-card">
            <h3>🔍 Filtres de Recherche</h3>
            <form id="search-form">
                <div class="input-group">
                    <label for="depart">Ville de Départ</label>
                    <input type="text" id="depart" placeholder="Ex: Paris" required>
                </div>
                <div class="input-group">
                    <label for="arrivee">Ville d'Arrivée</label>
                    <input type="text" id="arrivee" placeholder="Ex: Lyon" required>
                </div>
                <div class="input-group">
                    <label for="date-voyage">Date du Voyage</label>
                    <input type="date" id="date-voyage">
                </div>
                
                <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                
                <!-- Filtres Avancés (US 4) -->
                <div class="input-group">
                    <label for="max-prix">Prix Maximum (Crédits)</label>
                    <input type="number" id="max-prix" placeholder="Ex: 50" min="1">
                </div>
                
                <div class="input-group">
                    <label for="min-note">Note Chauffeur Minimale</label>
                    <select id="min-note">
                        <option value="">Tous les chauffeurs</option>
                        <option value="4">★★★★☆ & plus (4+)</option>
                        <option value="3">★★★☆☆ & plus (3+)</option>
                        <option value="2">★★☆☆☆ & plus (2+)</option>
                    </select>
                </div>

                <div class="input-group" style="display:flex; align-items:center; gap:10px; margin-top:15px;">
                    <input type="checkbox" id="eco-filter" style="width:auto; cursor:pointer;">
                    <label for="eco-filter" style="margin:0; cursor:pointer; font-size:0.9rem;">🌿 Véhicule Électrique</label>
                </div>

                <button type="submit" class="btn-primary" style="width:100%; margin-top:15px;">Rechercher</button>
            </form>
        </aside>

        <!-- Résultats de la recherche -->
        <section class="results-section">
            <h2 style="text-align:left; color:#2c3e50; margin-top:0;">Résultats de recherche</h2>
            
            <div id="proposal-container"></div>
            
            <div id="results-container" class="results-grid">
                <p class="info-text">Saisissez une ville de départ et de destination pour lancer la recherche.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 EcoRide. <a href="mentions_legales.html">Mentions Légales</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsContainer = document.getElementById('results-container');
            const proposalContainer = document.getElementById('proposal-container');
            const searchForm = document.getElementById('search-form');

            // Hide espace link if not logged in
            const userStr = localStorage.getItem('user');
            if(!userStr) {
                const menuEspace = document.getElementById('menu-espace');
                if (menuEspace) menuEspace.style.display = 'none';
            }

            async function fetchTrajets(params = "") {
                resultsContainer.innerHTML = "<p class='info-text'>Recherche en cours...</p>";
                proposalContainer.innerHTML = "";
                
                try {
                    const response = await fetch(`../back-end/api/search_trajets.php?${params}`);
                    const data = await response.json();

                    if (data.status === "success" && data.results.length > 0) {
                        resultsContainer.innerHTML = data.results.map(trajet => {
                            const starRating = "★".repeat(Math.round(trajet.note_chauffeur)) + "☆".repeat(5 - Math.round(trajet.note_chauffeur));
                            return `
                                <div class="card-trajet">
                                    <div>
                                        ${trajet.est_ecologique ? '<span class="badge-eco"><i class="fas fa-leaf"></i> ÉCO</span>' : ''}
                                        <div class="price">${parseFloat(trajet.prix_personne).toFixed(2)} Credits</div>
                                        <strong style="font-size:1.1rem; color:#2c3e50;">${trajet.lieu_depart} <i class="fas fa-arrow-right"></i> ${trajet.lieu_arrivee}</strong>
                                        <p style="margin:8px 0 0 0; color:#555;"><i class="fas fa-clock"></i> ${trajet.date_depart} à ${trajet.heure_depart.substring(0,5)}</p>
                                    </div>
                                    
                                    <div>
                                        <div class="chauffeur-info">
                                            <img src="${trajet.photo_profil || '../images/default-avatar.png'}" class="photo-mini" alt="Chauffeur">
                                            <div style="text-align:left;">
                                                <strong>${trajet.prenom || 'Chauffeur'}</strong><br>
                                                <span class="stars">${starRating}</span>
                                                <small style="color:#777;">(${trajet.note_chauffeur}/5)</small>
                                            </div>
                                        </div>
                                        <p style="margin:8px 0 0 0; text-align:left;"><small><i class="fas fa-chair"></i> ${trajet.places_disponibles} places restantes</small></p>
                                        <a href="detail.html?id=${trajet.id_covoiturage}" class="btn-view-detail">Voir le Détail</a>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        resultsContainer.innerHTML = "<p class='info-text'>Aucun trajet disponible pour ces critères de recherche.</p>";
                        
                        // Suggestion de date alternative (US 3)
                        if (data.closest_date) {
                            const dateFormatted = new Date(data.closest_date).toLocaleDateString('fr-FR');
                            proposalContainer.innerHTML = `
                                <div class="alert-proposal">
                                    <strong>💡 Proposition alternative :</strong>
                                    <p>Il n'y a aucun trajet à la date sélectionnée. Cependant, un trajet similaire est proposé le <strong>${dateFormatted}</strong>.</p>
                                    <button class="btn-proposal" onclick="setAlternateDate('${data.closest_date}')">Rechercher pour le ${dateFormatted}</button>
                                </div>
                            `;
                        }
                    }
                } catch (error) {
                    resultsContainer.innerHTML = "<p class='info-text'>Erreur lors du chargement des covoiturages.</p>";
                }
            }

            // Global callback to trigger alternate date search
            window.setAlternateDate = (date) => {
                document.getElementById('date-voyage').value = date;
                searchForm.dispatchEvent(new Event('submit'));
            };

            // Check if page opened with landing page search terms
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('depart')) {
                document.getElementById('depart').value = urlParams.get('depart');
                document.getElementById('arrivee').value = urlParams.get('arrivee');
                if (urlParams.get('date')) {
                    document.getElementById('date-voyage').value = urlParams.get('date');
                }
                
                const searchParams = new URLSearchParams({
                    depart: urlParams.get('depart'),
                    arrivee: urlParams.get('arrivee'),
                    date: urlParams.get('date') || ''
                });
                fetchTrajets(searchParams.toString());
            }

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const params = new URLSearchParams({
                    depart: document.getElementById('depart').value,
                    arrivee: document.getElementById('arrivee').value,
                    date: document.getElementById('date-voyage').value,
                    eco: document.getElementById('eco-filter').checked,
                    max_prix: document.getElementById('max-prix').value,
                    min_note: document.getElementById('min-note').value
                });
                fetchTrajets(params.toString());
            });
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
