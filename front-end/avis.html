<section class="avis-section">
    <h2>Laissez-nous votre avis</h2>
    
    <form id="avis-form" class="form-container">
        
        <div class="form-group">
            <label for="pseudo">Votre Pseudo :</label>
            <input type="text" id="pseudo" name="pseudo" placeholder="Ex: EcoRider94" required>
        </div>

        <div class="form-group">
            <label for="note">Note (sur 5) :</label>
            <select id="note" name="note" required>
                <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
                <option value="4">⭐⭐⭐⭐ (Très bien)</option>
                <option value="3">⭐⭐⭐ (Bien)</option>
                <option value="2">⭐⭐ (Moyen)</option>
                <option value="1">⭐ (Décevant)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="commentaire">Votre commentaire :</label>
            <textarea id="commentaire" name="commentaire" rows="4" placeholder="Racontez-nous votre trajet..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Publier mon avis</button>
    </form>
</section>
